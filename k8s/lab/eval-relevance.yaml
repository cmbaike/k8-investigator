# Standalone-Pod workloads (no Deployment owner, no probes) for diagnostic-
# relevance evaluation. Lab only; all live in ai-ops-demo because the
# restricted investigator can only read that namespace. Remove with:
#   kubectl delete pod -n ai-ops-demo -l eval=relevance
#
# eval-bare-crash       crash-loops (exit 1); declares no probe of any kind
# eval-bare-pull        scheduled, image can never be pulled (ImagePullBackOff)
# eval-oom-recovered    killed ONCE for memory (limit 32Mi), then stays up
# eval-bare-notready    runs, declares a readiness probe nothing answers
---
apiVersion: v1
kind: Pod
metadata:
  name: eval-bare-crash
  namespace: ai-ops-demo
  labels: {eval: relevance}
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: [sh, -c, 'echo starting; exit 1']
---
apiVersion: v1
kind: Pod
metadata:
  name: eval-bare-pull
  namespace: ai-ops-demo
  labels: {eval: relevance}
spec:
  containers:
    - name: app
      image: nonexistent-registry.example.invalid/ghost/app:999
---
apiVersion: v1
kind: Pod
metadata:
  name: eval-oom-recovered
  namespace: ai-ops-demo
  labels: {eval: relevance}
spec:
  containers:
    - name: app
      image: busybox:1.36
      command:
        - sh
        - -c
        - 'if [ -f /marker/ran ]; then sleep 3600; else touch /marker/ran; head -c 400000000 /dev/zero | tail -n 1; fi'
      resources:
        requests: {memory: 16Mi}
        limits: {memory: 32Mi}
      volumeMounts: [{name: marker, mountPath: /marker}]
  volumes:
    - name: marker
      emptyDir: {}
---
apiVersion: v1
kind: Pod
metadata:
  name: eval-bare-notready
  namespace: ai-ops-demo
  labels: {eval: relevance}
spec:
  containers:
    - name: app
      image: nginx:1.27
      readinessProbe:
        httpGet: {path: /does-not-exist, port: 8080}
        periodSeconds: 5
        failureThreshold: 2
