---
apiVersion: v1
kind: Namespace
metadata:
  name: scenario-configmap
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-app
  namespace: scenario-configmap
spec:
  replicas: 1
  selector:
    matchLabels:
      app: config-app
  template:
    metadata:
      labels:
        app: config-app
    spec:
      containers:
        - name: app
          image: nginx:1.27
          volumeMounts:
            - name: app-config
              mountPath: /etc/app-config
      volumes:
        - name: app-config
          configMap:
            name: nonexistent-config