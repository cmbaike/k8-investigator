# apiVersion: v1
# kind: Namespace
# metadata:
#   name: scenario-imagepull
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ceb
  namespace: ai-ops-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ceb
  template:
    metadata:
      labels:
        app: ceb
    spec:
      containers:
        - name: app
          image: nonexistent-registry.example.invalid/ghost/app:999