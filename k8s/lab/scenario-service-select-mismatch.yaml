# ============================================================
# Scenario 5: Service Selector Mismatch
# ============================================================
# ---
# apiVersion: v1
# kind: Namespace
# metadata:
#   name: scenario-service
# ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: ai-ops-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: app
          image: nginx:1.27
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: ai-ops-demo
spec:
  selector:
    app: wrong-label
  ports:
    - port: 80
      targetPort: 80