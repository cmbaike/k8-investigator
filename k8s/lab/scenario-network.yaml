# ============================================================
# Scenario 8: NetworkPolicy Blocking Ingress
# ============================================================
---
apiVersion: v1
kind: Namespace
metadata:
  name: scenario-network
  labels:
    scenario: network-failure
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: scenario-network
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: app
          image: nginx:1.27
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: scenario-network
spec:
  selector:
    app: backend
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: block-all-ingress
  namespace: scenario-network
spec:
  podSelector:
    matchLabels:
      app: backend
  policyTypes:
    - Ingress