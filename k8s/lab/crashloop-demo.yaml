apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-api
  namespace: ai-ops-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payments-api
  template:
    metadata:
      labels:
        app: payments-api
    spec:
      containers:
        - name: payments-api
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              echo "Starting payments-api"
              echo "ERROR: required environment variable PAYMENTS_DB_HOST is not set"
              exit 1
